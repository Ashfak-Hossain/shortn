name: ci

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start compose stack
        run: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait
      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost/healthz && echo "API ready" && break
            echo "Waiting... ($i/30)" && sleep 3
          done
      - name: Run integration tests
        run: go test -tags integration -v ./test/... -count=1
      - name: Tear down compose stack
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg SERVICE=api -t shortn-api:ci .

  # Build & push multi-arch images to GHCR — only after the checks pass, and only
  # on a real merge to master (not PRs or feature branches).
  push-image:
    needs: [lint, test, integration, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to GHCR
    strategy:
      matrix:
        service: [api, analytics] # build both from the one parameterized Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3 # emulators for cross-arch builds
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          # GHCR image paths must be lowercase, hence the literal owner.
          tags: |
            ghcr.io/ashfak-hossain/shortn-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/ashfak-hossain/shortn-${{ matrix.service }}:latest
