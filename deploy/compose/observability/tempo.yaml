# Tempo (traces backend) — single-binary, local block storage for dev.
# Receives spans PUSHED by the app over OTLP

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m # flush often so traces show up quickly in dev

compactor:
  compaction:
    block_retention: 24h # dev: keep a day of traces, then reclaim

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
