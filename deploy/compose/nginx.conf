upstream shortn_api {
    server api-1:8080;
    server api-2:8080;
    server api-3:8080;

    # Keep a pool of idle TCP connections open to the API instances and reuse them
    # instead of doing a fresh handshake + teardown on every request. Without this,
    # sustained load churns connections (and piles up TIME_WAIT sockets over time),
    # which inflated our client-side tail latency far above the app's own handler p99.
    keepalive 64;
}

server {
    listen 80;

    location / {
        proxy_pass http://shortn_api;

        # Upstream keepalive only works over HTTP/1.1 with the Connection header
        # cleared — nginx otherwise sends "Connection: close" to the upstream and
        # tears the connection down after each request, defeating the pool above.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Forward the real client IP so application logs show the origin address,
        # not the nginx container address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }
}
