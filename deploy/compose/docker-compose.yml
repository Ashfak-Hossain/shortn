name: shortn

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: shortn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d shortn"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    # No volume: a cache is ephemeral by design. If Redis is wiped, the app
    # repopulates it from Postgres on the next miss. Persisting it would only
    # buy us a warm cache after a restart, at the cost of stale data surviving.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://dev:dev@postgres:5432/shortn?sslmode=disable",
        "up",
      ]

  redpanda:
    image: redpandadata/redpanda:v26.1.10
    command:
      - redpanda
      - start
      - --mode=dev-container # single-node dev defaults; skips prod preflight checks
      - --smp=1 # 1 core - keep the local footprint tiny
      # The dual-listener gotcha. A Kafka client connects to a bootstrap address, then the
      # broker hands back the *advertised* address to use for real traffic. So we advertise
      # TWO: containers on the compose network use redpanda:9092; my machine uses
      # localhost:19092. Advertise the wrong one and clients connect, then hang.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092" # external Kafka API
      - "9644:9644" # admin + metrics
    volumes:
      # Unlike redis, the log MUST persist: undelivered clicks live here. Wiping this
      # loses events the analytics consumer hasn't drained yet.
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      timeout: 3s
      retries: 10

  api-1:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      ENV: dev
      DATABASE_URL: postgres://dev:dev@postgres:5432/shortn?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      WORKER_ID: "0"
      INSTANCE_ID: api-1
      SQIDS_ALPHABET: "0aA1bB2cC3dD4eE5fF6gG7hH8iI9jJkKlLmMnNoOpPqQrRsStTuUvVwWxXyYzZ"
      KAFKA_BROKERS: redpanda:9092 # internal listener — these are containers
      KAFKA_TOPIC: shortn.clicks
      # This dev/CI stack runs concurrency and load tests that all originate from one
      # host IP, so they share a single bucket. Give the limiter headroom here so
      # legitimate test bursts aren't throttled; the conservative production defaults
      # (10 rps / 20 burst) stay in internal/config and the prod deploy.
      RATE_LIMIT_RPS: "1000"
      RATE_LIMIT_BURST: "2000"
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4318 # traces push here; the localhost default is wrong inside a container
      OTEL_SEMCONV_STABILITY_OPT_IN: http/dup # emit http.server.request.duration (seconds), not just the legacy ms metric

  api-2:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      ENV: dev
      DATABASE_URL: postgres://dev:dev@postgres:5432/shortn?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      WORKER_ID: "1"
      INSTANCE_ID: api-2
      SQIDS_ALPHABET: "0aA1bB2cC3dD4eE5fF6gG7hH8iI9jJkKlLmMnNoOpPqQrRsStTuUvVwWxXyYzZ"
      KAFKA_BROKERS: redpanda:9092 # internal listener — these are containers
      KAFKA_TOPIC: shortn.clicks
      RATE_LIMIT_RPS: "1000" # dev/CI headroom — see api-1
      RATE_LIMIT_BURST: "2000"
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4318
      OTEL_SEMCONV_STABILITY_OPT_IN: http/dup

  api-3:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      ENV: dev
      DATABASE_URL: postgres://dev:dev@postgres:5432/shortn?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      WORKER_ID: "2"
      INSTANCE_ID: api-3
      SQIDS_ALPHABET: "0aA1bB2cC3dD4eE5fF6gG7hH8iI9jJkKlLmMnNoOpPqQrRsStTuUvVwWxXyYzZ"
      KAFKA_BROKERS: redpanda:9092 # internal listener — these are containers
      KAFKA_TOPIC: shortn.clicks
      RATE_LIMIT_RPS: "1000" # dev/CI headroom — see api-1
      RATE_LIMIT_BURST: "2000"
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4318
      OTEL_SEMCONV_STABILITY_OPT_IN: http/dup

  analytics:
    build:
      context: ../..
      dockerfile: Dockerfile # same parameterized Dockerfile, different SERVICE
      args:
        SERVICE: analytics
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: info
      ENV: dev
      INSTANCE_ID: analytics
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4318 # push spans to Tempo; without this the analytics half of the trace never arrives
      DATABASE_URL: postgres://dev:dev@postgres:5432/shortn?sslmode=disable
      KAFKA_BROKERS: redpanda:9092 # internal listener — it's a container
      KAFKA_TOPIC: shortn.clicks
      KAFKA_GROUP: shortn-analytics

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3

  # ------------ observability stack ------------
  # Direct export: Prometheus PULLS /metrics; the app PUSHES traces to Tempo over
  # OTLP; Alloy tails container stdout and ships logs to Loki; Grafana reads all
  # three. Config lives in ./observability/.

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # tempo query API (Grafana datasource)
      - "4317:4317" # OTLP gRPC — app pushes spans here
      - "4318:4318" # OTLP HTTP — app pushes spans here

  loki:
    image: grafana/loki:3.7.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.17.0
    # dev-only: run as root so Alloy can read the Docker socket to discover
    # containers. In k8s (Phase 7) this becomes a DaemonSet reading node logs.
    user: root
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    ports:
      - "12345:12345" # alloy's own UI

  grafana:
    image: grafana/grafana:11.6
    environment:
      # Dev convenience: open Grafana with no login, full admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  pgdata:
  redpanda-data:
  tempo-data:
