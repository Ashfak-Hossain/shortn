apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shortn-postgres
  labels:
    app: shortn-postgres
spec:
  serviceName: shortn-postgres # must match the headless Service name above
  replicas: 1
  selector:
    matchLabels:
      app: shortn-postgres
  template:
    metadata:
      labels:
        app: shortn-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env: # must match the DATABASE_URL creds (dev/dev/shortn)
            - name: POSTGRES_USER
              value: "dev"
            - name: POSTGRES_PASSWORD
              value: "dev"
            - name: POSTGRES_DB
              value: "shortn"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata # subdir of the mount — avoids the initdb-on-nonempty-volume gotcha
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dev", "-d", "shortn"] # "ready" only when it accepts connections
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
  volumeClaimTemplates: # ← the "stateful" part: a PVC per pod, persists across restarts
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
