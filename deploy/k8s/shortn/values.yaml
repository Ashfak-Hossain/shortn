# Default values for the shortn chart.
# values-dev.yaml / values-prod.yaml override these per environment.

image:
  # Prefix prepended to every image name; INCLUDE a trailing slash.
  # "" = local images loaded into kind.
  registry: ""
  tag: dev
  pullPolicy: IfNotPresent

api:
  replicas: 1 # used only when autoscaling is disabled
  autoscaling:
    enabled: false # dev turns this on; prod uses fixed replicas
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 50
  rateLimit: # per-client token bucket; high here for k6 load tests, public profiles override low
    rps: 1000
    burst: 2000
  resources:
    requests: # guaranteed floor
      cpu: 50m
      memory: 64Mi
    limits: # ceiling — over memory ⇒ OOM-killed
      cpu: 250m
      memory: 128Mi

analytics:
  enabled: true # set false to run the core shortener without the async consumer
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Redpanda + the analytics consumer are optional — a small/edge cluster can run
# the core shortener without them (clicks just aren't recorded).
redpanda:
  enabled: true

# We commit a SealedSecret (needs the sealed-secrets controller). On a cluster
# without that controller, set this false and create the Secret directly.
sealedSecret:
  enabled: true

ingress:
  className: nginx
  host: shortn.localhost
