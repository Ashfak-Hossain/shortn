apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortn
  labels:
    app: shortn-api
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shortn-api
                port:
                  number: 8080
