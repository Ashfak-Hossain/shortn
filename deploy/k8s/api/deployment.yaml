apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortn-api
  labels:
    app: shortn-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shortn-api # which pods this Deployment owns
  template: # blueprint of each pod
    metadata:
      labels:
        app: shortn-api # add tag in each pod
    spec:
      containers:
        - name: api
          image: shortn-api:dev # comopse image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom: # pull ALL keys from both into env
            - configMapRef:
                name: shortn-api-config
            - secretRef:
                name: shortn-api-secret
          livenessProbe: # "alive?" → /healthz (dependency-free). Fail ⇒ restart
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe: # pre traffic rotation "/readyz"
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: # guaranteed floor — also the HPA's denominator
              cpu: 50m
              memory: 64Mi
            limits: # ceiling — over memory ⇒ OOM-killed
              cpu: 250m
              memory: 128Mi
