apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shortn
  namespace: argocd # the Application object lives where ArgoCD watches
spec:
  project: default
  source:
    repoURL: https://github.com/Ashfak-Hossain/shortn.git
    targetRevision: master # the branch ArgoCD tracks
    path: deploy/k8s/shortn # the Helm chart in the repo
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc # this same cluster
    namespace: default # where the app's resources land
  syncPolicy:
    automated:
      selfHeal: true # revert manual drift back to match git
      prune: true # delete resources removed from git
    syncOptions:
      - CreateNamespace=true
