server {
    listen 80;

    # The dashboard is served under /app. `root` maps a request like
    # /app/assets/x.js to /usr/share/nginx/html/app/assets/x.js. Unknown paths
    # fall back to the SPA's index.html so client-side routes (e.g. /app/links)
    # still work on a hard refresh instead of 404-ing.
    location /app/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/index.html;
    }

    # Bare /app (no trailing slash) → canonical /app/.
    location = /app {
        return 301 /app/;
    }
}
